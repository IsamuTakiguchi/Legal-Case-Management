<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3358"/>
      <stop offset="0.55" stop-color="#26497c"/>
      <stop offset="1" stop-color="#3468a8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="330">
      <stop offset="0" stop-color="#f3cf6a"/>
      <stop offset="1" stop-color="#d59f2b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b1a33" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 背景（角丸・グラデーション・光沢） -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <path d="M0 116C0 52 52 0 116 0H396C460 0 512 52 512 116V180C380 240 200 260 0 300Z" fill="url(#sheen)"/>
  <!-- ティラノサウルス（T-Lex） -->
  <g transform="translate(2,-6)">
    <g filter="url(#shadow)">
      <!-- しっぽ -->
      <path d="M214 240 C152 230 92 242 54 280 A17 17 0 0 0 64 302 C122 316 172 322 216 324 Z" fill="#ffffff"/>
      <!-- 奥の脚 -->
      <g stroke="#b7cae4" stroke-linecap="round" fill="none">
        <path d="M202 328 L178 386" stroke-width="42"/>
        <path d="M160 398 L216 398" stroke-width="26"/>
      </g>
      <!-- 胴 -->
      <ellipse cx="236" cy="292" rx="94" ry="76" fill="#ffffff"/>
      <!-- 首 -->
      <path d="M280 250 L332 204" stroke="#ffffff" stroke-width="88" stroke-linecap="round" fill="none"/>
      <!-- 頭とマズル -->
      <ellipse cx="344" cy="194" rx="60" ry="54" fill="#ffffff"/>
      <path d="M342 146 H414 A30 30 0 0 1 444 176 V212 A28 28 0 0 1 416 240 H342 Z" fill="#ffffff"/>
      <!-- 手前の脚 -->
      <g stroke="#ffffff" stroke-linecap="round" fill="none">
        <path d="M268 324 L258 390" stroke-width="52"/>
        <path d="M244 404 L314 404" stroke-width="30"/>
      </g>
      <!-- 小さい前あし（木槌を持つ） -->
      <path d="M300 288 L348 318" stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none"/>
    </g>
    <!-- 首もとの襟章（差し色） -->
    <rect x="256" y="222" width="88" height="16" rx="8" fill="url(#gold)" transform="rotate(49 300 230)"/>
    <!-- 口と歯 -->
    <path d="M348 214 H434" stroke="#1f3c68" stroke-width="16" stroke-linecap="round" fill="none"/>
    <g fill="#ffffff">
      <path d="M384 206 L398 206 L391 222 Z"/>
      <path d="M412 206 L426 206 L419 222 Z"/>
    </g>
    <!-- 目 -->
    <circle cx="360" cy="178" r="13" fill="#1f3c68"/>
  </g>
</svg>
