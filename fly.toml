# Fly.io にデプロイする場合の設定（fly launch --copy-config で利用）
app = "legal-case-management"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "8787"
  TZ = "Asia/Tokyo"
  NODE_ENV = "production"

[mounts]
  source = "app_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
